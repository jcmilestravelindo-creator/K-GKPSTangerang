<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kolekte GKPS - Aman & Standalone</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: ['cursive'],
                        sans: ['Inter', 'sans-serif']
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .modal-scroll::-webkit-scrollbar { width: 8px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .scrolling-touch { -webkit-overflow-scrolling: touch; overflow-x: auto; }

        @media print {
            @page { size: A4; margin: 5mm; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 11px; background-color: white; }
            .no-print, nav, button, .guidance-box, .maintenance-screen { display: none !important; }
            main { width: 100%; max-width: none; padding: 0; margin: 0; }
            .print-header { padding: 10px !important; border-bottom-width: 2px !important; }
            .print-header h1 { font-size: 16px !important; margin-bottom: 2px; }
            .print-header h2 { font-size: 14px !important; }
            .print-grid-compact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px !important; padding: 8px !important; }
            .print-input-compact { border: none !important; padding: 0 !important; height: auto !important; font-weight: bold; font-size: 11px; }
            label { font-size: 9px !important; text-transform: uppercase; color: #666; }
            table { font-size: 10px !important; }
            th, td { padding: 4px 2px !important; }
            .print-signature-area { margin-top: 10px !important; padding: 10px !important; border-top: 1px solid #ccc; page-break-inside: avoid; }
            .print-signature-box { height: 40px !important; } 
            .print-signature-input { padding-top: 5px !important; font-size: 12px !important; }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DEFINISI IKON (SESUAI GAMBAR NOMOR 1-10) ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Cloud = ({ className }) => <IconBase className={className}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></IconBase>;
        const CloudOff = ({ className }) => <IconBase className={className}><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"></path><line x1="1" y1="1" x2="23" y2="23"></line></IconBase>;
        const HelpCircle = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></HelpCircle>;
        const QrCode = ({ className }) => <IconBase className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></IconBase>;
        const Lock = ({ className }) => <IconBase className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Lock>;
        const BarChart2 = ({ className }) => <IconBase className={className}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></IconBase>;
        const Save = ({ className }) => <IconBase className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Save>;
        const Download = ({ className }) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>;
        const Upload = ({ className }) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconBase>;
        const Trash2 = ({ className }) => <IconBase className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
        const Printer = ({ className }) => <IconBase className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></IconBase>;
        const Settings = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></IconBase>;

        // --- DATA KONSTAN ---
        const DENOMINATIONS = [
          { value: 100000, label: 'Rp 100.000' }, { value: 50000, label: 'Rp 50.000' },
          { value: 20000, label: 'Rp 20.000' }, { value: 10000, label: 'Rp 10.000' },
          { value: 5000, label: 'Rp 5.000' }, { value: 2000, label: 'Rp 2.000' },
          { value: 1000, label: 'Rp 1.000' }, { value: 500, label: 'Koin/Lain' },
        ];

        const KANTONG_LABELS = [
          { id: 'k1', name: 'Kantong 1', color: 'bg-blue-50 border-blue-200' },
          { id: 'k2', name: 'Kantong 2', color: 'bg-green-50 border-green-200' },
          { id: 'k3', name: 'Kantong 3', color: 'bg-yellow-50 border-yellow-200' },
          { id: 'k4', name: 'Kantong 4', color: 'bg-purple-50 border-purple-200' },
          { id: 'k5', name: 'Kantong HBN', color: 'bg-orange-50 border-orange-200' },
        ];

        const SECTORS = ["Sektor I", "Sektor II", "Sektor III", "Sektor IV", "Sektor V", "Sektor VI", "Sektor VII", "Sektor VIII", "Sektor IX", "Sektor X", "Sektor XI", "Sektor XII"];
        const formatRupiah = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);

        // --- KONFIGURASI DEFAULT ---
        const DEFAULT_FIREBASE_CONFIG = JSON.stringify({
          apiKey: "AIzaSyDhSwLYn1MnqiQShoXtoyx99x6XbRo6i7E",
          authDomain: "kolektegkpstangerang.firebaseapp.com",
          projectId: "kolektegkpstangerang",
          storageBucket: "kolektegkpstangerang.firebasestorage.app",
          messagingSenderId: "682847647326",
          appId: "1:682847647326:web:3c26e2440f59f1fc7466cf"
        });

        const INITIAL_STATE_TEMPLATE = {
            metadata: { tanggal: new Date().toISOString().split('T')[0], minggu: '', sektor: 'Sektor I', pengkhotbah: '', jenisIbadah: 'Minggu Pagi' },
            kehadiran: { pria: 0, wanita: 0, bapa: 0, inang: 0, sm: 0, pemuda: 0 }, 
            uang: KANTONG_LABELS.reduce((acc, k) => { acc[k.id] = DENOMINATIONS.reduce((dAcc, d) => ({ ...dAcc, [d.value]: 0 }), {}); return acc; }, {}),
            tandaTangan: { penghitung1: '', sign_penghitung1: '', penghitung2: '', sign_penghitung2: '', bendahara: '', sign_bendahara: '' }
        };

        const validateAndFixData = (data) => {
            if (!data) return INITIAL_STATE_TEMPLATE;
            const safeUang = { ...INITIAL_STATE_TEMPLATE.uang };
            if (data.uang) Object.keys(safeUang).forEach(key => { if (data.uang[key]) safeUang[key] = { ...safeUang[key], ...data.uang[key] }; });
            return {
                metadata: { ...INITIAL_STATE_TEMPLATE.metadata, ...data.metadata },
                kehadiran: { ...INITIAL_STATE_TEMPLATE.kehadiran, ...data.kehadiran },
                uang: safeUang,
                tandaTangan: { ...INITIAL_STATE_TEMPLATE.tandaTangan, ...data.tandaTangan }
            };
        };

        function App() {
          const [data, setData] = useState(() => { const saved = localStorage.getItem('gkps_kolekte_data'); return saved ? validateAndFixData(JSON.parse(saved)) : INITIAL_STATE_TEMPLATE; });
          const [history, setHistory] = useState(() => { const savedHist = localStorage.getItem('gkps_kolekte_history'); return savedHist ? JSON.parse(savedHist) : []; });
          const [appPin, setAppPin] = useState(() => localStorage.getItem('gkps_app_pin') || '123456');
          const [fbConfigRaw, setFbConfigRaw] = useState(() => localStorage.getItem('gkps_fb_config') || DEFAULT_FIREBASE_CONFIG);
          const [db, setDb] = useState(null);
          const [authUser, setAuthUser] = useState(null);
          const [syncStatus, setSyncStatus] = useState('offline'); 
          const [lastSavedTime, setLastSavedTime] = useState(new Date().toLocaleTimeString('id-ID'));
          
          const [showHistory, setShowHistory] = useState(false);
          const [showHelp, setShowHelp] = useState(false);
          const [showPinModal, setShowPinModal] = useState(false); 
          const [showShareModal, setShowShareModal] = useState(false); 
          const [showDbPinModal, setShowDbPinModal] = useState(false);
          const [dbPinInput, setDbPinInput] = useState('');
          const [pinForm, setPinForm] = useState({ old: '', new: '', confirm: '' });
          
          const isPartonggoan = data.metadata.jenisIbadah === "Partonggoan";
          const fileInputRef = useRef(null);

          // 1. ONLINE DAN SYNC (LOGIC)
          useEffect(() => {
              if (fbConfigRaw) {
                  try {
                      const config = JSON.parse(fbConfigRaw);
                      if (!firebase.apps.length) firebase.initializeApp(config);
                      const firestore = firebase.firestore();
                      setDb(firestore);
                      firebase.auth().onAuthStateChanged((user) => {
                          if (user) { setAuthUser(user); setSyncStatus('connected'); }
                          else { firebase.auth().signInAnonymously().catch(() => setSyncStatus('error')); }
                      });
                  } catch (e) { setSyncStatus('error'); }
              }
          }, [fbConfigRaw]);

          // 11. AUTO SAVED
          useEffect(() => { 
            localStorage.setItem('gkps_kolekte_data', JSON.stringify(data)); 
            setLastSavedTime(new Date().toLocaleTimeString('id-ID'));
          }, [data]);

          const handleMetaChange = (e) => { setData({ ...data, metadata: { ...data.metadata, [e.target.name]: e.target.value } }); };
          const handleAttChange = (e) => { const val = e.target.value === '' ? '' : parseInt(e.target.value); setData(prev => ({ ...prev, kehadiran: { ...prev.kehadiran, [e.target.name]: val } })); };
          const handleSignChange = (e) => { setData({ ...data, tandaTangan: { ...data.tandaTangan, [e.target.name]: e.target.value } }); };
          const handleMoneyChange = (kId, dVal, qty) => { const v = qty === '' ? '' : parseInt(qty); setData(p => ({ ...p, uang: { ...p.uang, [kId]: { ...p.uang[kId], [dVal]: v } } })); };

          const calculateBagTotal = (kId, sData = data) => DENOMINATIONS.reduce((t, d) => t + ((sData.uang[kId]?.[d.value] || 0) * d.value), 0);
          const calculateGrandTotal = (sData = data) => KANTONG_LABELS.reduce((t, k) => t + calculateBagTotal(k.id, sData), 0);
          const calculateTotalJiwa = (sData = data) => {
              const k = sData.kehadiran;
              return sData.metadata.jenisIbadah === "Partonggoan" ? (k.bapa||0) + (k.inang||0) + (k.sm||0) + (k.pemuda||0) : (k.pria||0) + (k.wanita||0);
          };

          // 4. GANTI PIN
          const handleChangePin = () => {
              if (pinForm.old !== appPin) return alert("PIN Lama salah!");
              if (pinForm.new.length < 6) return alert("PIN Minimal 6 angka!");
              if (pinForm.new !== pinForm.confirm) return alert("Konfirmasi PIN tidak cocok!");
              setAppPin(pinForm.new);
              localStorage.setItem('gkps_app_pin', pinForm.new);
              alert("PIN Berhasil diubah!");
              setShowPinModal(false);
          };

          // 6. SIMPAN ARSIP
          const saveToHistory = () => { 
            if (confirm('Simpan data ke arsip riwayat?')) { 
                const n = { id: Date.now(), date: data.metadata.tanggal, jenis: data.metadata.jenisIbadah, total: calculateGrandTotal(data), details: data }; 
                const newHist = [n, ...history];
                setHistory(newHist);
                localStorage.setItem('gkps_kolekte_history', JSON.stringify(newHist));
                alert('Tersimpan di Arsip!'); 
            } 
          };

          // 7. BACKUP
          const handleBackup = () => {
            const blob = new Blob([JSON.stringify({ data, history, app: 'GKPS' })], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = `Backup_GKPS_${data.metadata.tanggal}.json`; a.click();
          };

          // 8. RESTORE
          const handleRestore = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const parsed = JSON.parse(ev.target.result);
                if (parsed.app === 'GKPS') {
                    setData(validateAndFixData(parsed.data));
                    setHistory(parsed.history || []);
                    alert("Restore Berhasil!");
                }
            };
            reader.readAsText(file);
          };

          // 9. RESET
          const resetData = () => { if (confirm('Kosongkan semua input formulir?')) setData(INITIAL_STATE_TEMPLATE); };

          // 10. CETAK
          const handlePrint = () => window.print();

          return (
            <div className="min-h-screen bg-gray-100 font-sans text-gray-800 print:bg-white">
              <input type="file" ref={fileInputRef} onChange={handleRestore} style={{ display: 'none' }} />
              
              <nav className="bg-blue-800 text-white shadow-lg print:hidden sticky top-0 z-50">
                <div className="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
                    {/* 11. AUTO SAVED DISPLAY */}
                    <div className="flex items-center space-x-3">
                        <div className="flex flex-col">
                            <span className="font-bold text-lg leading-none">GKPS App</span>
                            <span className="text-[10px] text-blue-200">Auto-saved: {lastSavedTime}</span>
                        </div>
                    </div>
                    
                    <div className="flex items-center space-x-2">
                        {/* 1. ONLINE DAN SYNC */}
                        <button onClick={() => setShowDbPinModal(true)} className={`p-2 rounded ${syncStatus === 'connected' ? 'bg-green-600' : 'bg-gray-600'}`} title="Online & Sync">
                            {syncStatus === 'connected' ? <Cloud className="h-5 w-5"/> : <CloudOff className="h-5 w-5"/>}
                        </button>
                        
                        {/* 2. PANDUAN */}
                        <button onClick={() => setShowHelp(true)} className="p-2 bg-blue-600 rounded" title="Panduan"><HelpCircle className="h-5 w-5"/></button>
                        
                        {/* 3. SHARE QR */}
                        <button onClick={() => setShowShareModal(true)} className="p-2 bg-blue-600 rounded" title="Share QR"><QrCode className="h-5 w-5"/></button>
                        
                        {/* 4. GANTI PIN */}
                        <button onClick={() => setShowPinModal(true)} className="p-2 bg-blue-700 rounded" title="Ganti PIN"><Lock className="h-5 w-5"/></button>
                        
                        {/* 5. RIWAYAT */}
                        <button onClick={() => setShowHistory(!showHistory)} className="p-2 bg-blue-700 rounded" title="Riwayat"><BarChart2 className="h-5 w-5"/></button>
                        
                        {/* 6. SIMPAN ARSIP */}
                        <button onClick={saveToHistory} className="p-2 bg-blue-700 rounded" title="Simpan Arsip"><Save className="h-5 w-5"/></button>
                        
                        {/* 7 & 8. BACKUP & RESTORE */}
                        <div className="flex bg-blue-900 rounded overflow-hidden">
                            <button onClick={handleBackup} className="p-2 hover:bg-blue-950 border-r border-blue-800" title="Backup"><Download className="h-5 w-5 text-green-400"/></button>
                            <button onClick={() => fileInputRef.current.click()} className="p-2 hover:bg-blue-950" title="Restore"><Upload className="h-5 w-5 text-yellow-400"/></button>
                        </div>
                        
                        {/* 9. RESET */}
                        <button onClick={resetData} className="p-2 bg-red-600 rounded" title="Reset"><Trash2 className="h-5 w-5"/></button>
                        
                        {/* 10. CETAK */}
                        <button onClick={handlePrint} className="flex items-center space-x-2 px-4 py-2 bg-green-600 rounded font-bold hover:bg-green-500"><Printer className="h-5 w-5"/><span>Cetak</span></button>
                    </div>
                </div>
              </nav>

              <main className="max-w-5xl mx-auto py-6 sm:px-6 print:max-w-full print:p-0">
                {/* FORM UTAMA */}
                <div className="bg-white shadow-xl rounded-lg overflow-hidden print:shadow-none">
                    <div className="border-b-4 border-blue-800 p-6 text-center print-header">
                        <h1 className="text-2xl font-bold uppercase">Formulir Setoran Kolekte</h1>
                        <h2 className="text-xl font-semibold text-blue-800">{isPartonggoan ? "PARTONGGOAN " : ""}GKPS TANGERANG</h2>
                    </div>

                    {/* Metadata Section */}
                    <div className="p-6 bg-gray-50 border-b print:bg-white grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-4">
                            <div><label className="text-sm font-medium">Tanggal</label><input type="date" name="tanggal" value={data.metadata.tanggal} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300 print:border-none" /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-sm font-medium">Sektor</label><select name="sektor" value={data.metadata.sektor} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300">{SECTORS.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                <div><label className="text-sm font-medium">Jenis Ibadah</label><select name="jenisIbadah" value={data.metadata.jenisIbadah} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300"><option>Minggu Pagi</option><option>Minggu Siang</option><option>Minggu Sore</option><option>Ibadah Sektor</option><option>Partonggoan</option></select></div>
                            </div>
                        </div>
                        <div className="space-y-4">
                            <div><label className="text-sm font-medium">Pengkhotbah</label><input type="text" name="pengkhotbah" value={data.metadata.pengkhotbah} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300" /></div>
                            <div>
                                <label className="text-sm font-medium mb-1 block">Kehadiran</label>
                                {!isPartonggoan ? (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="text-center"><span className="text-xs text-gray-500">Pria</span><input type="number" name="pria" value={data.kehadiran.pria || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded"/></div>
                                        <div className="text-center"><span className="text-xs text-gray-500">Wanita</span><input type="number" name="wanita" value={data.kehadiran.wanita || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded"/></div>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-4 gap-2">
                                        {['bapa', 'inang', 'sm', 'pemuda'].map(f => (
                                            <div key={f} className="text-center"><span className="text-[10px] text-gray-500 uppercase">{f}</span><input type="number" name={f} value={data.kehadiran[f] || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded text-xs"/></div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Table Section */}
                    <div className="p-6 border-b">
                        <div className="overflow-x-auto">
                            <table className="min-w-full divide-y border text-sm">
                                <thead className="bg-gray-50"><tr><th className="py-2 pl-2 text-left">Pecahan</th>{KANTONG_LABELS.map(k => <th key={k.id} className={`px-2 py-2 text-center ${k.color}`}>{k.name}</th>)}</tr></thead>
                                <tbody>
                                    {DENOMINATIONS.map(d => (
                                        <tr key={d.value}>
                                            <td className="py-1 pl-2 font-medium">{d.label}</td>
                                            {KANTONG_LABELS.map(k => (
                                                <td key={`${k.id}-${d.value}`} className="px-1 py-1 text-center">
                                                    <input type="number" min="0" value={data.uang[k.id][d.value] || ''} onChange={e => handleMoneyChange(k.id, d.value, e.target.value)} className="w-16 text-center border-gray-300 rounded print:border-none print:text-right" />
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                    <tr className="bg-gray-100 font-bold"><td className="py-2 pl-2">TOTAL</td>{KANTONG_LABELS.map(k => <td key={k.id} className="px-2 py-2 text-right">{formatRupiah(calculateBagTotal(k.id))}</td>)}</tr>
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-4 flex justify-end"><div className="bg-blue-900 text-white p-3 rounded shadow print:bg-white print:text-black print:border print:w-full print:flex print:justify-between"><span className="font-bold mr-4">TOTAL KESELURUHAN:</span><span className="font-bold text-xl">{formatRupiah(calculateGrandTotal())}</span></div></div>
                    </div>

                    {/* Signature Section */}
                    <div className="p-6 grid grid-cols-3 gap-4 text-center">
                        {[{r:'Penghitung 1', k:'penghitung1'}, {r:'Penghitung 2', k:'penghitung2'}, {r:'Bendahara', k:'bendahara'}].map(s => (
                            <div key={s.k} className="flex flex-col items-center">
                                <div className="h-24 w-full border-b border-gray-400 mb-2 relative"><textarea name={`sign_${s.k}`} value={data.tandaTangan[`sign_${s.k}`]} onChange={handleSignChange} className="w-full h-full text-center border-none bg-transparent resize-none pt-8 italic font-handwriting" placeholder="(Tanda Tangan)"/></div>
                                <input type="text" name={s.k} value={data.tandaTangan[s.k]} onChange={handleSignChange} className="text-center w-full font-bold text-sm bg-transparent border-none" placeholder={`Nama ${s.r}`} />
                                <label className="text-xs text-gray-500 mt-1">{s.r}</label>
                            </div>
                        ))}
                    </div>
                </div>

                {/* MODALS (PANDUAN, PIN, QR) */}
                {showHelp && (
                    <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg p-6 max-w-md w-full shadow-2xl">
                            <h3 className="font-bold text-lg mb-4 border-b pb-2">Panduan Penggunaan</h3>
                            <ul className="text-sm space-y-3 list-disc pl-4">
                                <li><b>Sync:</b> Awan hijau berarti data Anda terhubung ke database cloud.</li>
                                <li><b>Arsip:</b> Gunakan tombol simpan (nomor 6) agar data tersimpan di riwayat.</li>
                                <li><b>Backup:</b> Download file backup secara rutin untuk keamanan data lokal.</li>
                            </ul>
                            <button onClick={() => setShowHelp(false)} className="mt-6 w-full py-2 bg-blue-600 text-white rounded font-bold">Tutup</button>
                        </div>
                    </div>
                )}

                {showPinModal && (
                    <div className="fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4">
                        <div className="bg-white rounded-lg p-6 max-w-sm w-full shadow-2xl">
                            <h3 className="font-bold text-lg mb-4">Ganti PIN Keamanan</h3>
                            <input type="password" placeholder="PIN Lama" className="w-full border p-2 mb-2 rounded" onChange={(e) => setPinForm({...pinForm, old: e.target.value})} />
                            <input type="password" placeholder="PIN Baru (6 angka)" className="w-full border p-2 mb-2 rounded" onChange={(e) => setPinForm({...pinForm, new: e.target.value})} />
                            <input type="password" placeholder="Konfirmasi PIN Baru" className="w-full border p-2 mb-4 rounded" onChange={(e) => setPinForm({...pinForm, confirm: e.target.value})} />
                            <div className="flex space-x-2">
                                <button onClick={() => setShowPinModal(false)} className="flex-1 py-2 bg-gray-200 rounded">Batal</button>
                                <button onClick={handleChangePin} className="flex-1 py-2 bg-blue-600 text-white rounded font-bold">Simpan</button>
                            </div>
                        </div>
                    </div>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
