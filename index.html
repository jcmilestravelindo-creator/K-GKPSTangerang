<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kolekte GKPS - Aman & Standalone</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script> 
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        handwriting: ['cursive'],
                        sans: ['Inter', 'sans-serif']
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .modal-scroll::-webkit-scrollbar { width: 8px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        .scrolling-touch { -webkit-overflow-scrolling: touch; overflow-x: auto; }

        @media print {
            @page { size: A4; margin: 5mm; }
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-size: 11px; background-color: white; }
            .no-print, nav, button, .guidance-box, .maintenance-screen { display: none !important; }
            main { width: 100%; max-width: none; padding: 0; margin: 0; }
            .print-header { padding: 10px !important; border-bottom-width: 2px !important; }
            .print-header h1 { font-size: 16px !important; margin-bottom: 2px; }
            .print-header h2 { font-size: 14px !important; }
            .print-grid-compact { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px !important; padding: 8px !important; }
            .print-input-compact { border: none !important; padding: 0 !important; height: auto !important; font-weight: bold; font-size: 11px; }
            label { font-size: 9px !important; text-transform: uppercase; color: #666; }
            table { font-size: 10px !important; }
            th, td { padding: 4px 2px !important; }
            .print-signature-area { margin-top: 10px !important; padding: 10px !important; border-top: 1px solid #ccc; page-break-inside: avoid; }
            .print-signature-box { height: 40px !important; } 
            .print-signature-input { padding-top: 5px !important; font-size: 12px !important; }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DEFINISI IKON ---
        const IconBase = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );

        const Save = ({ className }) => <IconBase className={className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></IconBase>;
        const Printer = ({ className }) => <IconBase className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></IconBase>;
        const Trash2 = ({ className }) => <IconBase className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconBase>;
        const Calculator = ({ className }) => <IconBase className={className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></IconBase>;
        const BarChart2 = ({ className }) => <IconBase className={className}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></IconBase>;
        const History = ({ className }) => <IconBase className={className}><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></IconBase>;
        const Download = ({ className }) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></IconBase>;
        const Upload = ({ className }) => <IconBase className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></IconBase>;
        const Eye = ({ className }) => <IconBase className={className}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></IconBase>;
        const X = ({ className }) => <IconBase className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconBase>;
        const HelpCircle = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconBase>;
        const Lock = ({ className }) => <IconBase className={className}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconBase>;
        const QrCode = ({ className }) => <IconBase className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></IconBase>;
        const Cloud = ({ className }) => <IconBase className={className}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></IconBase>;
        const CloudOff = ({ className }) => <IconBase className={className}><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"></path><line x1="1" y1="1" x2="23" y2="23"></line></IconBase>;
        const Settings = ({ className }) => <IconBase className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></IconBase>;
        const Edit = ({ className }) => <IconBase className={className}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></IconBase>;
        const FileSpreadsheet = ({ className }) => <IconBase className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></IconBase>;

        // --- DATA KONSTAN ---
        const DENOMINATIONS = [
          { value: 100000, label: 'Rp 100.000' },
          { value: 50000, label: 'Rp 50.000' },
          { value: 20000, label: 'Rp 20.000' },
          { value: 10000, label: 'Rp 10.000' },
          { value: 5000, label: 'Rp 5.000' },
          { value: 2000, label: 'Rp 2.000' },
          { value: 1000, label: 'Rp 1.000' },
          { value: 500, label: 'Koin/Lain' },
        ];

        const KANTONG_LABELS = [
          { id: 'k1', name: 'Kantong 1', color: 'bg-blue-50 border-blue-200' },
          { id: 'k2', name: 'Kantong 2', color: 'bg-green-50 border-green-200' },
          { id: 'k3', name: 'Kantong 3', color: 'bg-yellow-50 border-yellow-200' },
          { id: 'k4', name: 'Kantong 4', color: 'bg-purple-50 border-purple-200' },
          { id: 'k5', name: 'Kantong HBN', color: 'bg-orange-50 border-orange-200' },
        ];

        const SECTORS = ["Sektor I", "Sektor II", "Sektor III", "Sektor IV", "Sektor V", "Sektor VI", "Sektor VII", "Sektor VIII", "Sektor IX", "Sektor X", "Sektor XI", "Sektor XII"];
        const formatRupiah = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n);

        const MaintenanceScreen = ({ message }) => (
            <div className="fixed inset-0 bg-gradient-to-br from-blue-900 to-gray-900 z-[100] flex flex-col items-center justify-center text-white p-6 text-center maintenance-screen animate-fade-in">
                <div className="bg-white/10 p-8 rounded-full mb-6 backdrop-blur-sm animate-pulse-slow"><Settings className="w-16 h-16 sm:w-24 sm:h-24 opacity-90 text-yellow-400" /></div>
                <h1 className="text-3xl sm:text-4xl font-bold mb-4 tracking-tight">Sistem Sedang Pemeliharaan</h1>
                <div className="bg-white/10 px-6 py-4 rounded-lg max-w-lg backdrop-blur-md border border-white/20"><p className="text-lg text-blue-100 font-medium">{message || "Peningkatan sistem..."}</p></div>
                <div className="mt-8 flex items-center text-sm opacity-50 space-x-2"><CloudOff className="w-4 h-4"/><span>Tim Multimedia & IT GKPS Tangerang</span></div>
            </div>
        );

        const SimpleChart = ({ history, onBarClick, selectedIds }) => {
          if (!history || history.length === 0) return <div className="text-center text-gray-400 p-4">Belum ada data riwayat.</div>;
          let data = selectedIds?.size > 0 ? history.filter(h => selectedIds.has(h.id)).reverse() : history.slice(0, 5).reverse();
          const maxVal = Math.max(...data.map(d => d.total));
          const getColor = (j) => {
              j = (j || '').toLowerCase();
              if (j.includes('pagi')) return 'bg-cyan-500'; if (j.includes('siang')) return 'bg-yellow-500'; if (j.includes('sore')) return 'bg-orange-500'; if (j.includes('sektor')) return 'bg-emerald-500'; if (j.includes('partonggoan')) return 'bg-purple-500'; return 'bg-gray-400';
          };
          return (
            <div className="w-full p-4">
                <div className="overflow-x-auto">
                  <div className={`flex items-end ${data.length > 5 ? 'justify-start' : 'justify-around'} space-x-4 h-64 border-l border-b border-gray-300 pb-2`}>
                    {data.map((item, idx) => (
                        <div key={idx} className="flex flex-col items-center group relative w-24 flex-shrink-0 cursor-pointer hover:scale-105 transition-transform" onClick={() => onBarClick(item)}>
                          <div className={`w-full rounded-t-sm transition-all duration-500 ${getColor(item.jenis)}`} style={{ height: `${maxVal > 0 ? (item.total / maxVal) * 160 : 0}px` }}></div>
                          <div className="mt-2 text-[10px] font-bold text-gray-700">{new Date(item.date).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</div>
                        </div>
                    ))}
                  </div>
                </div>
            </div>
          );
        };

        const QrCodeCanvas = ({ value }) => {
            const canvasRef = useRef(null);
            useEffect(() => { if (canvasRef.current && value) new QRious({ element: canvasRef.current, value, size: 250, level: 'H' }); }, [value]);
            return <canvas ref={canvasRef} className="border shadow-sm rounded"/>;
        };

        const DEFAULT_FIREBASE_CONFIG = JSON.stringify({
          apiKey: "AIzaSyDhSwLYn1MnqiQShoXtoyx99x6XbRo6i7E",
          authDomain: "kolektegkpstangerang.firebaseapp.com",
          projectId: "kolektegkpstangerang",
          storageBucket: "kolektegkpstangerang.firebasestorage.app",
          messagingSenderId: "682847647326",
          appId: "1:682847647326:web:3c26e2440f59f1fc7466cf"
        });

        const INITIAL_STATE_TEMPLATE = {
            metadata: { tanggal: new Date().toISOString().split('T')[0], minggu: '', sektor: 'Sektor I', pengkhotbah: '', liturgis: '', jenisIbadah: 'Minggu Pagi' },
            kehadiran: { pria: 0, wanita: 0, bapa: 0, inang: 0, sm: 0, pemuda: 0 }, 
            uang: KANTONG_LABELS.reduce((acc, k) => { acc[k.id] = DENOMINATIONS.reduce((dAcc, d) => ({ ...dAcc, [d.value]: 0 }), {}); return acc; }, {}),
            tandaTangan: { penghitung1: '', sign_penghitung1: '', penghitung2: '', sign_penghitung2: '', bendahara: '', sign_bendahara: '' }
        };

        const validateAndFixData = (data) => {
            if (!data) return INITIAL_STATE_TEMPLATE;
            const safeUang = { ...INITIAL_STATE_TEMPLATE.uang };
            if (data.uang) Object.keys(safeUang).forEach(key => { if (data.uang[key]) safeUang[key] = { ...safeUang[key], ...data.uang[key] }; });
            return {
                metadata: { ...INITIAL_STATE_TEMPLATE.metadata, ...data.metadata },
                kehadiran: { ...INITIAL_STATE_TEMPLATE.kehadiran, ...data.kehadiran },
                uang: safeUang,
                tandaTangan: { ...INITIAL_STATE_TEMPLATE.tandaTangan, ...data.tandaTangan }
            };
        };

        function App() {
          const [data, setData] = useState(() => { const saved = localStorage.getItem('gkps_kolekte_data'); return saved ? validateAndFixData(JSON.parse(saved)) : INITIAL_STATE_TEMPLATE; });
          const [history, setHistory] = useState(() => { const savedHist = localStorage.getItem('gkps_kolekte_history'); return savedHist ? JSON.parse(savedHist) : []; });
          const [appPin, setAppPin] = useState(() => localStorage.getItem('gkps_app_pin') || '123456');
          const [fbConfigRaw, setFbConfigRaw] = useState(() => localStorage.getItem('gkps_fb_config') || DEFAULT_FIREBASE_CONFIG);
          const [db, setDb] = useState(null);
          const [authUser, setAuthUser] = useState(null);
          const [syncStatus, setSyncStatus] = useState('offline'); 
          const lastEditTime = useRef(0); 

          const [showHistory, setShowHistory] = useState(false);
          const [showHelp, setShowHelp] = useState(false);
          const [showPinModal, setShowPinModal] = useState(false); 
          const [showShareModal, setShowShareModal] = useState(false); 
          const [showDbModal, setShowDbModal] = useState(false);
          const [showDbPinModal, setShowDbPinModal] = useState(false);
          const [dbPinInput, setDbPinInput] = useState('');
          const [viewData, setViewData] = useState(null);
          const [selectedIds, setSelectedIds] = useState(new Set()); 
          const fileInputRef = useRef(null);
          const [pinForm, setPinForm] = useState({ old: '', new: '', confirm: '' });
          const [maintenanceMode, setMaintenanceMode] = useState(false);
          const [maintenanceMsg, setMaintenanceMsg] = useState("");

          const isPartonggoan = data.metadata.jenisIbadah === "Partonggoan";

          // FIREBASE INIT & SYNC
          useEffect(() => {
              if (fbConfigRaw) {
                  try {
                      const config = JSON.parse(fbConfigRaw);
                      if (!firebase.apps.length) firebase.initializeApp(config);
                      const firestore = firebase.firestore();
                      setDb(firestore);
                      firebase.auth().onAuthStateChanged((user) => {
                          if (user) { setAuthUser(user); setSyncStatus('connected'); }
                          else { firebase.auth().signInAnonymously().catch(() => setSyncStatus('error')); }
                      });
                  } catch (e) { setSyncStatus('error'); }
              }
          }, [fbConfigRaw]);

          useEffect(() => {
              if (!db) return;
              const configRef = db.collection('gkps_config').doc('global');
              return configRef.onSnapshot((doc) => {
                  if (doc.exists) { const conf = doc.data(); setMaintenanceMode(conf.maintenance === true); setMaintenanceMsg(conf.message || ""); }
              });
          }, [db]);

          useEffect(() => {
              if (!db || !authUser) return;
              const docId = `${data.metadata.tanggal}_${data.metadata.jenisIbadah.replace(/\s+/g, '_')}`;
              const docRef = db.collection('gkps_transactions').doc(docId);
              const unsub = docRef.onSnapshot((doc) => {
                  if (doc.exists && !doc.metadata.hasPendingWrites && (Date.now() - lastEditTime.current > 5000)) {
                      const safeData = validateAndFixData(doc.data());
                      if (JSON.stringify(safeData) !== JSON.stringify(data)) setData(safeData);
                  }
              });
              const save = setTimeout(() => { if (authUser) docRef.set(data, { merge: true }); }, 2000);
              return () => { unsub(); clearTimeout(save); };
          }, [data, db, authUser]);

          useEffect(() => { localStorage.setItem('gkps_kolekte_data', JSON.stringify(data)); }, [data]);
          useEffect(() => { localStorage.setItem('gkps_kolekte_history', JSON.stringify(history)); }, [history]);
          useEffect(() => { localStorage.setItem('gkps_app_pin', appPin); }, [appPin]);

          const handleMetaChange = (e) => { lastEditTime.current = Date.now(); setData({ ...data, metadata: { ...data.metadata, [e.target.name]: e.target.value } }); };
          const handleAttChange = (e) => { lastEditTime.current = Date.now(); const val = e.target.value === '' ? '' : parseInt(e.target.value); setData(prev => ({ ...prev, kehadiran: { ...prev.kehadiran, [e.target.name]: val } })); };
          const handleSignChange = (e) => { lastEditTime.current = Date.now(); setData({ ...data, tandaTangan: { ...data.tandaTangan, [e.target.name]: e.target.value } }); };
          const handleMoneyChange = (kId, dVal, qty) => { lastEditTime.current = Date.now(); const v = qty === '' ? '' : parseInt(qty); setData(p => ({ ...p, uang: { ...p.uang, [kId]: { ...p.uang[kId], [dVal]: v } } })); };

          const calculateBagTotal = (kId, sData = data) => DENOMINATIONS.reduce((t, d) => t + ((sData.uang[kId]?.[d.value] || 0) * d.value), 0);
          const calculateGrandTotal = (sData = data) => KANTONG_LABELS.reduce((t, k) => t + calculateBagTotal(k.id, sData), 0);
          const calculateTotalJiwa = (sData = data) => {
              const k = sData.kehadiran;
              return sData.metadata.jenisIbadah === "Partonggoan" 
                ? (k.bapa||0) + (k.inang||0) + (k.sm||0) + (k.pemuda||0)
                : (k.pria||0) + (k.wanita||0);
          };

          const resetData = () => { if (confirm('Reset form?')) setData(INITIAL_STATE_TEMPLATE); };
          const saveToHistory = () => { if (confirm('Simpan ke Riwayat?')) { const n = { id: Date.now(), date: data.metadata.tanggal, jenis: data.metadata.jenisIbadah, total: calculateGrandTotal(data), details: data }; setHistory([n, ...history]); alert('Tersimpan!'); } };
          const handlePrint = () => window.print();

          const createSheetFromData = (itemData) => {
             const isP = itemData.metadata.jenisIbadah === "Partonggoan";
             const wsData = [
                 ["TANGGAL", itemData.metadata.tanggal, "SEKTOR", itemData.metadata.sektor],
                 ["FORMULIR SETORAN KOLEKTE", "", isP ? "PARTONGGOAN GKPS TANGERANG" : "GKPS TANGERANG"],
                 ["JENIS IBADAH", itemData.metadata.jenisIbadah],
                 ["PENGKHOTBAH", itemData.metadata.pengkhotbah], []
             ];
             if(!isP) { wsData.push(["KEHADIRAN", "Pria", itemData.kehadiran.pria], ["", "Wanita", itemData.kehadiran.wanita]); }
             else { wsData.push(["KEHADIRAN", "Bapa", itemData.kehadiran.bapa], ["", "Inang", itemData.kehadiran.inang], ["", "SM", itemData.kehadiran.sm], ["", "Pemuda", itemData.kehadiran.pemuda]); }
             wsData.push(["", "Total", calculateTotalJiwa(itemData) + " Jiwa"], []);
             wsData.push(["Pecahan", ...KANTONG_LABELS.map(k => k.name)]);
             DENOMINATIONS.forEach(d => wsData.push([d.label, ...KANTONG_LABELS.map(k => itemData.uang[k.id]?.[d.value] || 0)]));
             wsData.push(["TOTAL", ...KANTONG_LABELS.map(k => formatRupiah(calculateBagTotal(k.id, itemData)))]);
             const ws = XLSX.utils.aoa_to_sheet(wsData);
             return ws;
          };

          const handleExportExcel = (hItem) => { const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, createSheetFromData(hItem.details), "Laporan"); XLSX.writeFile(wb, `Laporan_GKPS_${hItem.details.metadata.tanggal}.xlsx`); };

          if (maintenanceMode) return <MaintenanceScreen message={maintenanceMsg} />;

          return (
            <div className="min-h-screen bg-gray-100 font-sans text-gray-800 print:bg-white">
              <nav className="bg-blue-800 text-white shadow-lg print:hidden sticky top-0 z-50">
                <div className="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
                    <div className="flex items-center space-x-3"><Calculator className="h-8 w-8" /><span className="font-bold text-xl hidden sm:block">GKPS App</span></div>
                    <div className="flex items-center space-x-2">
                        <button onClick={() => setSyncStatus('connected')} className={`p-2 rounded ${syncStatus === 'connected' ? 'bg-green-600' : 'bg-gray-600'}`}>{syncStatus === 'connected' ? <Cloud className="h-5 w-5"/> : <CloudOff className="h-5 w-5"/>}</button>
                        <button onClick={() => setShowHelp(true)} className="p-2 bg-blue-600 rounded"><HelpCircle className="h-5 w-5"/></button>
                        <button onClick={() => setShowHistory(!showHistory)} className="p-2 bg-blue-700 rounded"><BarChart2 className="h-5 w-5"/></button>
                        <button onClick={saveToHistory} className="p-2 bg-blue-700 rounded"><Save className="h-5 w-5"/></button>
                        <button onClick={resetData} className="p-2 bg-red-600 rounded"><Trash2 className="h-5 w-5"/></button>
                        <button onClick={handlePrint} className="flex items-center space-x-2 px-4 py-2 bg-green-600 rounded font-bold"><Printer className="h-5 w-5"/><span>Cetak</span></button>
                    </div>
                </div>
              </nav>

              <main className="max-w-5xl mx-auto py-6 sm:px-6 print:max-w-full print:p-0">
                <div className="bg-white shadow-xl rounded-lg overflow-hidden print:shadow-none">
                    <div className="border-b-4 border-blue-800 p-6 text-center print-header">
                        <h1 className="text-2xl font-bold uppercase">Formulir Setoran Kolekte</h1>
                        <h2 className="text-xl font-semibold text-blue-800">
                            {isPartonggoan ? "PARTONGGOAN " : ""}GKPS TANGERANG
                        </h2>
                    </div>

                    <div className="p-6 bg-gray-50 border-b print-grid-compact print:bg-white grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-4 print:space-y-1">
                            <div><label className="block text-sm font-medium">Tanggal</label><input type="date" name="tanggal" value={data.metadata.tanggal} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300 print-input-compact" /></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium">Sektor</label><select name="sektor" value={data.metadata.sektor} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300 print-input-compact">{SECTORS.map(s => <option key={s} value={s}>{s}</option>)}</select></div>
                                <div><label className="block text-sm font-medium">Jenis Ibadah</label><select name="jenisIbadah" value={data.metadata.jenisIbadah} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300 print-input-compact"><option>Minggu Pagi</option><option>Minggu Siang</option><option>Minggu Sore</option><option>Ibadah Sektor</option><option>Partonggoan</option></select></div>
                            </div>
                            <div><label className="block text-sm font-medium">Minggu Ke / Nama</label><input type="text" name="minggu" value={data.metadata.minggu} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300 print-input-compact" /></div>
                        </div>
                        <div className="space-y-4 print:space-y-1">
                            <div><label className="block text-sm font-medium">Pengkhotbah</label><input type="text" name="pengkhotbah" value={data.metadata.pengkhotbah} onChange={handleMetaChange} className="mt-1 block w-full rounded border-gray-300 print-input-compact" /></div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Kehadiran</label>
                                {!isPartonggoan ? (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="text-center"><span className="text-xs text-gray-500">Pria</span><input type="number" name="pria" value={data.kehadiran.pria || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded print-input-compact"/></div>
                                        <div className="text-center"><span className="text-xs text-gray-500">Wanita</span><input type="number" name="wanita" value={data.kehadiran.wanita || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded print-input-compact"/></div>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-4 gap-2">
                                        <div className="text-center"><span className="text-[10px] text-gray-500">Bapa</span><input type="number" name="bapa" value={data.kehadiran.bapa || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded print-input-compact"/></div>
                                        <div className="text-center"><span className="text-[10px] text-gray-500">Inang</span><input type="number" name="inang" value={data.kehadiran.inang || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded print-input-compact"/></div>
                                        <div className="text-center"><span className="text-[10px] text-gray-500">SM</span><input type="number" name="sm" value={data.kehadiran.sm || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded print-input-compact"/></div>
                                        <div className="text-center"><span className="text-[10px] text-gray-500">Pemuda</span><input type="number" name="pemuda" value={data.kehadiran.pemuda || ''} onChange={handleAttChange} className="w-full text-center border-gray-300 rounded print-input-compact"/></div>
                                    </div>
                                )}
                            </div>
                            <div className="text-right text-xs font-bold text-gray-700">Total: {calculateTotalJiwa()} Jiwa</div>
                        </div>
                    </div>

                    <div className="p-6 border-b">
                        <div className="overflow-x-auto scrolling-touch">
                            <table className="min-w-full divide-y divide-gray-300 border">
                                <thead className="bg-gray-50"><tr><th className="py-2 pl-2 text-left text-sm">Pecahan</th>{KANTONG_LABELS.map(k => <th key={k.id} className={`px-2 py-2 text-center text-sm ${k.color}`}>{k.name}</th>)}</tr></thead>
                                <tbody className="divide-y divide-gray-200">
                                    {DENOMINATIONS.map(d => (
                                        <tr key={d.value}>
                                            <td className="whitespace-nowrap py-1 pl-2 text-sm font-medium">{d.label}</td>
                                            {KANTONG_LABELS.map(k => (
                                                <td key={`${k.id}-${d.value}`} className="px-1 py-1 text-center">
                                                    <input type="number" min="0" value={data.uang[k.id][d.value] || ''} onChange={e => handleMoneyChange(k.id, d.value, e.target.value)} className="w-16 text-center border-gray-300 rounded text-sm print:border-none print:text-right" />
                                                </td>
                                            ))}
                                        </tr>
                                    ))}
                                    <tr className="bg-gray-100 font-bold"><td className="py-2 pl-2 text-sm">TOTAL</td>{KANTONG_LABELS.map(k => <td key={k.id} className="px-2 py-2 text-right text-sm">{formatRupiah(calculateBagTotal(k.id))}</td>)}</tr>
                                </tbody>
                            </table>
                        </div>
                        <div className="mt-4 flex justify-end"><div className="bg-blue-900 text-white p-3 rounded shadow print:bg-white print:text-black print:border print:w-full print:flex print:justify-between"><span className="font-bold mr-4">TOTAL KESELURUHAN:</span><span className="font-bold text-xl">{formatRupiah(calculateGrandTotal())}</span></div></div>
                    </div>

                    <div className="p-6 bg-gray-50 print-signature-area print:bg-white grid grid-cols-3 gap-4 text-center">
                        {[{r:'Penghitung 1', k:'penghitung1'}, {r:'Penghitung 2', k:'penghitung2'}, {r:'Bendahara', k:'bendahara'}].map(s => (
                            <div key={s.k} className="flex flex-col items-center">
                                <div className="h-24 w-full border-b border-gray-400 mb-2 relative print-signature-box"><textarea name={`sign_${s.k}`} value={data.tandaTangan[`sign_${s.k}`]} onChange={handleSignChange} className="w-full h-full text-center border-none bg-transparent resize-none pt-8 italic font-handwriting" placeholder="(Tanda Tangan)"/></div>
                                <input type="text" name={s.k} value={data.tandaTangan[s.k]} onChange={handleSignChange} className="text-center w-full font-bold text-sm bg-transparent border-none" placeholder={`Nama ${s.r}`} />
                                <label className="text-xs text-gray-500 mt-1">{s.r}</label>
                            </div>
                        ))}
                    </div>
                </div>

                {showHistory && (
                    <div className="mt-6 bg-white shadow-xl rounded-lg p-6 print:hidden">
                        <h3 className="font-bold text-lg mb-4 flex items-center"><History className="mr-2 text-blue-600"/> Riwayat Data</h3>
                        <div className="overflow-auto max-h-60 border rounded">
                             <table className="min-w-full text-sm">
                                <thead className="bg-gray-100 sticky top-0"><tr><th className="p-2 text-left">Tanggal</th><th className="p-2">Jenis</th><th className="p-2 text-right">Total</th><th className="p-2 text-center">Aksi</th></tr></thead>
                                <tbody>{history.map(h => (<tr key={h.id} className="border-b"><td className="p-2">{new Date(h.date).toLocaleDateString('id-ID')}</td><td className="p-2">{h.jenis}</td><td className="p-2 text-right font-bold">{formatRupiah(h.total)}</td><td className="p-2 text-center"><button onClick={() => handleExportExcel(h)} className="text-green-600 p-1"><FileSpreadsheet className="w-5 h-5"/></button></td></tr>))}</tbody>
                             </table>
                        </div>
                    </div>
                )}
              </main>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
